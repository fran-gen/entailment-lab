[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entailment-lab"
version = "0.1.0"
description = "Evaluate language models on semantic relationships."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/entailment_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
